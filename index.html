<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Import HTML & Calcul Prix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Importer un fichier HTML et calculer les prix</h1>
  </header>

  <main>
    <section class="controls">
      <!-- Sélecteur classique -->
      <input type="file" id="fileInput" accept=".html,.htm">
  
      <!-- Zone de drag & drop -->
      <div id="dropZone">
        Glissez-déposez votre fichier HTML ici
      </div>
  
      <button id="exportBtn" style="display:none;">Exporter en CSV</button>
      <button id="exportBtnXls" style="display:none;">Exporter pour Excel</button>
      <button id="toggleBtn" style="display:none;" onclick="toggleColumns([2, 4, 5, 6, 7, 8, 10, 11])">Afficher / Masquer les colonnes</button>

      
    </section>

    <section id="errors" aria-live="polite"></section>

    <section id="result"></section>
  </main>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

</body>
</html>
